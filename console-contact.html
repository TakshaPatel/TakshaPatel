<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>console-contact</title>

<link href="https://fonts.googleapis.com/css?family=JetBrains+Mono" rel="stylesheet">

<style>
body {
    margin: 0;
    background-color: #1f2228;
    color: #ffffff;
    font-family: 'JetBrains Mono', monospace;
    padding: 20px;
}


.console-nav {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 24px;
    color: #9EFF9E;
}

.console-nav span {
    cursor: pointer;
    opacity: 0.6;
}

.console-nav span.active {
    opacity: 1;
    text-decoration: underline;
}
</style>
</head>

<body>

<p style="color: greenyellow;">[username@hostname]$ cat contact.txt</p>

<p>
Email: takshapatel3@gmail.com<br>
GitHub: github.com/TakshaPatel<br>
Status: learning, building, breaking things responsibly
</p>

<p style="color:#888;">
(type arrows to navigate, enter to select)
</p>


<div class="console-nav">
    <span data-link="index.html">&lt;BACK&gt;</span>
    <span data-link="console-home.html">&lt;HOME&gt;</span>
    <span data-link="console-contact.html">&lt;CONTACT&gt;</span>
    <span data-link="console-projects.html">&lt;PROJECTS&gt;</span>
</div>

<script>
const items = document.querySelectorAll('.console-nav span');


let index = Number(sessionStorage.getItem('consoleNavIndex')) || 1;

function update() {
    items.forEach((el, i) =>
        el.classList.toggle('active', i === index)
    );
}


update();


function saveIndex() {
    sessionStorage.setItem('consoleNavIndex', index);
}

items.forEach((el, i) => {
    el.addEventListener('click', () => {
        index = i;
        saveIndex();
        window.location.href = el.dataset.link;
    });
});


document.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight') {
        index = (index + 1) % items.length;
        saveIndex();
        update();
    }

    if (e.key === 'ArrowLeft') {
        index = (index - 1 + items.length) % items.length;
        saveIndex();
        update();
    }

    if (e.key === 'Enter') {
        saveIndex();
        window.location.href = items[index].dataset.link;
    }
});
</script>



</body>
</html>
