<style>
:root {
    --bg: rgb(15, 15, 15);
    --card-bg: rgb(24, 24, 24);
    --accent: rgb(0, 255, 251);
    --text: rgb(255, 255, 255);
    --radius: 20px;
    --mono: 'Source Code Pro', monospace;
}

/* Global */
* { box-sizing: border-box; }
body {
    margin: 0;
    background-color: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
    text-align: center;
    padding-top: 120px;
}

/* Dock */
.dock {
    position: fixed;
    top: 10px;
    left: 50%;
    transform: translateX(-50%);
    background-color: rgb(42, 42, 42);
    border-radius: var(--radius);
    outline: 1px solid var(--accent);
    display: flex;
    gap: 30px;
    padding: 10px 25px;
    z-index: 1000;
    box-shadow: 0 5px 20px rgba(0,255,251,0.3);
}
.dock a {
    color: var(--text);
    text-decoration: none;
    font-family: var(--mono);
    font-weight: 700;
    transition: transform 0.2s, color 0.2s;
    font-size: 1rem;
}
.dock a:hover {
    transform: scale(1.2);
    color: var(--accent);
}

/* Card */
.card {
    max-width: 900px;
    margin: 40px auto;
    background-color: var(--card-bg);
    outline: 1px solid var(--accent);
    padding: 30px;
    border-radius: var(--radius);
    transition: transform 0.2s, box-shadow 0.2s;
}
.card:hover {
    transform: translateY(-5px);
    box-shadow: 0 0 30px var(--accent);
}

h1 { font-size: 2.2rem; margin-bottom: 15px; font-family: var(--mono); }
p  { font-family: var(--mono); }

/* Projects Grid */
.projects-container {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 20px;
    margin-top: 30px;
}

.project-card {
    background-color: var(--card-bg);
    border: 1px solid var(--accent);
    border-radius: 50px;
    padding: 20px;
    width: 250px;
    min-height: 100px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    transition: transform 0.2s, box-shadow 0.2s;
    color: var(--accent);
    text-decoration: none;
    font-family: var(--mono);
    font-weight: 700;
}
.project-card:hover {
    transform: translateY(-5px);
    box-shadow: 0 0 20px var(--accent);
    color: white;
}

.project-card p {
    font-family: var(--mono);
    letter-spacing: 0.5px;
    text-align: center;
}

/* Responsive */
@media (max-width: 768px) {
    h1 { font-size: 1.8rem; }
    .dock { gap: 20px; padding: 8px 20px; }
    .dock a { font-size: 0.9rem; }
    .project-card { width: 100%; max-width: 300px; }
}
</style>
</head>
