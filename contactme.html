<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Me</title>

<!-- Google Fonts: Source Code Pro -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Code+Pro:wght@400;700&display=swap" rel="stylesheet">

<style>
:root {
    --bg: rgb(15, 15, 15);
    --card-bg: rgb(24, 24, 24);
    --accent: rgb(0, 255, 251);
    --text: rgb(255, 255, 255);
    --radius: 20px;
    --mono: 'Source Code Pro', monospace;
}

/* Global */
* { box-sizing: border-box; }
body {
    margin: 0;
    background-color: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
    text-align: center;
    padding-top: 120px;
}

/* Dock */
.dock {
    position: fixed;
    top: 10px;
    left: 50%;
    transform: translateX(-50%);
    background-color: rgb(42, 42, 42);
    border-radius: var(--radius);
    outline: 1px solid var(--accent);
    display: flex;
    gap: 30px;
    padding: 10px 25px;
    z-index: 1000;
    box-shadow: 0 5px 20px rgba(0,255,251,0.3);
}
.dock a {
    color: var(--text);
    text-decoration: none;
    font-family: var(--mono);
    font-weight: 700;
    transition: transform 0.2s, color 0.2s;
    font-size: 1rem;
}
.dock a:hover {
    transform: scale(1.2);
    color: var(--accent);
}

/* Card */
.card {
    max-width: 800px;
    margin: 40px auto;
    background-color: var(--card-bg);
    outline: 1px solid var(--accent);
    padding: 30px;
    border-radius: var(--radius);
    transition: transform 0.2s, box-shadow 0.2s;
    line-height: 1.6;
}
.card:hover {
    transform: translateY(-5px);
    box-shadow: 0 0 30px var(--accent);
}

h1 { font-size: 2.2rem; margin-bottom: 15px; font-family: var(--mono); }
p  { font-family: var(--mono); }

/* Contact Links */
.contact-links {
    display: flex;
    flex-direction: column;
    gap: 15px;
    margin-top: 20px;
}
.contact-links a {
    background-color: var(--card-bg);
    border: 1px solid var(--accent);
    border-radius: 50px;
    padding: 12px;
    text-decoration: none;
    color: var(--accent);
    font-family: var(--mono);
    font-weight: 700;
    transition: transform 0.2s, box-shadow 0.2s;
}
.contact-links a:hover {
    transform: translateY(-5px);
    box-shadow: 0 0 20px var(--accent);
    color: white;
}

/* Responsive */
@media (max-width: 768px) {
    h1 { font-size: 1.8rem; }
    .dock { gap: 20px; padding: 8px 20px; }
    .dock a { font-size: 0.9rem; }
}
</style>
</head>
<body>

<!-- Dock -->
<div class="dock">
    <a href="index.html">Home</a>
    <a href="contactme.html">Contact Me</a>
    <a href="projects.html">Projects</a>
    <a href="console-home.html">console-view</a>
</div>

<!-- Contact Card -->
<div class="card">
    <h1>Get in Touch</h1>
    <p>I’m always open to discussing cybersecurity, programming, or new projects.</p>

    <div class="contact-links">
        <a href="mailto:takshapatel3@gmail.com">📧 Email Me: takshapatel3@gmail.com</a>
        <a href="https://github.com/TakshaPatel" target="_blank">💻 GitHub</a>
    </div>
</div>

</body>
</html>
