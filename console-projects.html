<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>console-projects</title>
<link href="https://fonts.googleapis.com/css?family=JetBrains+Mono" rel="stylesheet">
<style>
body {
    margin: 0;
    background-color: #1f2228;
    color: #ffffff;
    font-family: 'JetBrains Mono', monospace;
    padding: 20px;
}

.project-card {
    display: block;
    border: 1px solid #9EFF9E;
    padding: 10px 15px;
    margin: 8px 0;
    text-decoration: none;
    color: white;
    cursor: pointer;
    transition: all 0.2s ease;
}
.project-card:hover,
.project-card.active {
    background-color: #9EFF9E;
    color: #2F333C;
}

.console-nav {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 24px;
    color: #9EFF9E;
}
.console-nav span {
    cursor: pointer;
    opacity: 0.6;
}
.console-nav span.active {
    opacity: 1;
    text-decoration: underline;
}
</style>
</head>
<body>

<p style="color: greenyellow;">[username@hostname]$ cat projects.txt</p>
<p style="color: yellow;"> ────── MY PROJECTS ────── </p>


<a class="project-card" href="https://github.com/TakshaPatel/browser/tree/main" target="_blank">PyQt Web Browser</a>
<a class="project-card" href="https://definition.streamlit.app/" target="_blank">AI Powered Dictionary</a>
<a class="project-card" href="https://github.com/TakshaPatel/FridayAI" target="_blank">AI Voice Assistant</a>
<a class="project-card" href="https://github.com/TakshaPatel/SkillSnap" target="_blank">Skill Snap</a>
<a class="project-card" href="https://github.com/TakshaPatel/RustyShell" target="_blank">RustyShell</a>
<a class="project-card" href="https://github.com/TakshaPatel/Recon" target="_blank">Recon</a>
<a class="project-card" href="https://github.com/TakshaPatel/SIMPLEPasswordManager" target="_blank">Password Manager</a>
<a class="project-card" href="https://github.com/TakshaPatel/WPAKeyminer" target="_blank">WPA Keyminer</a>

<p style="color:#888;">(use arrows to navigate, enter to open pages, space to open projects in new tab)</p>


<div class="console-nav">
    <span data-link="index.html">&lt;BACK&gt;</span>
    <span data-link="console-home.html">&lt;HOME&gt;</span>
    <span data-link="console-contact.html">&lt;CONTACT&gt;</span>
    <span data-link="console-projects.html">&lt;PROJECTS&gt;</span>
</div>

<script>

const navItems = document.querySelectorAll('.console-nav span');
let navIndex = Number(sessionStorage.getItem('consoleNavIndex')) || 2; // projects active
function updateNav() {
    navItems.forEach((el, i) => el.classList.toggle('active', i === navIndex));
}
updateNav();


const projectCards = document.querySelectorAll('.project-card');
let projectIndex = 0;
function updateProject() {
    projectCards.forEach((el, i) => el.classList.toggle('active', i === projectIndex));
}
updateProject();


document.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight') {
        navIndex = (navIndex + 1) % navItems.length;
        sessionStorage.setItem('consoleNavIndex', navIndex);
        updateNav();
    }
    if (e.key === 'ArrowLeft') {
        navIndex = (navIndex - 1 + navItems.length) % navItems.length;
        sessionStorage.setItem('consoleNavIndex', navIndex);
        updateNav();
    }
    if (e.key === 'ArrowDown') {
        projectIndex = (projectIndex + 1) % projectCards.length;
        updateProject();
    }
    if (e.key === 'ArrowUp') {
        projectIndex = (projectIndex - 1 + projectCards.length) % projectCards.length;
        updateProject();
    }
    if (e.key === 'Enter') {
        // Enter navigates the console nav
        window.location.href = navItems[navIndex].dataset.link;
    }
    if (e.key === ' ') {
        // Space opens the currently selected project in a new tab
        e.preventDefault(); // prevent scrolling
        const selectedProject = projectCards[projectIndex];
        window.open(selectedProject.href, '_blank');
    }
});


navItems.forEach((el, i) => {
    el.addEventListener('click', () => {
        navIndex = i;
        sessionStorage.setItem('consoleNavIndex', navIndex);
        window.location.href = el.dataset.link;
    });
});
projectCards.forEach(card => {
    card.addEventListener('click', () => window.open(card.href, '_blank'));
});
</script>


</body>
</html>
